<nav aria-label="breadcrumb navigation">
    <ol class="breadcrumb">
        @for (crumb of breadcrumbs; track crumb.link; let isLast = $last) {
            @if (!isLast) {
                <li class="breadcrumb-item">
                    <a [routerLink]="crumb.link">{{ crumb.label }}</a>
                </li>
            } @else {
                <li class="breadcrumb-item">
                    {{ crumb.label }}
                </li>
            }
        }
    </ol>
</nav>
