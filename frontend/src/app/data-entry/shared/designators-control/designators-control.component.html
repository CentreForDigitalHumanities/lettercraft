<div class="mb-3">
    @if (designators$.value.length === 0) {
        <p><i>No designators added.</i></p>
    }
    <ul class="list-group">
        @for (designator of designators$.value; track designator; let i = $index) {
            <li class="list-group-item hstack gap-3">
                <span>{{designator}}</span>
                <button class="btn btn-light ms-auto" type="button"
                    [disabled]="disabled"
                    (blur)="blur$.next()"
                    (click)="removeDesignator(i)">
                    <lc-icon [icon]="actionIcons.remove"
                        [attr.aria-label]="designatorRemoveLabel(designator)" />
                </button>
            </li>
        }
    </ul>
</div>

<form class="mb-3" [formGroup]="addForm" (ngSubmit)="onAddFormSubmit()">
    <label class="form-label" for="input-new-designator">Add a designator</label>
    <div class="input-group mb-3">
        <input type="text" class="form-control" id="input-new-designator"
            [formControl]="addForm.controls.designator"
            (blur)="blur$.next()">
        <button class="btn btn-primary" type="submit"
            [disabled]="disabled"
            (blur)="blur$.next()">
            <lc-icon [icon]="actionIcons.add" aria-label="add provided designator" />
        </button>
    </div>
</form>
