<div class="hstack">
    <button class="btn btn-danger ms-auto" (click)="clickDelete.emit()">
        @if (!deletingInProgress) {
            <lc-icon [icon]="actionIcons.delete" />
        } @else {
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">Deleting {{ entityName }}...</span>
            </div>
        }
        Delete {{ entityName }}
    </button>
</div>
