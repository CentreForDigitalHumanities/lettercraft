<h1 class="mb-4">
    @if (icon) {
        <lc-icon [icon]="icon" />
    }
    {{object.name}}
    @if (object.source) {
        <span class="text-primary">
            ({{object.source.name}})
        </span>
    }
</h1>
@if (object.description) {
    <p class="lead mb-4">
        {{object.description}}
    </p>
}
