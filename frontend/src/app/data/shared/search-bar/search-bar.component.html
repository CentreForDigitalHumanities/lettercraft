<form class="mb-4 mt-4" role="search" (submit)="onSubmit($event)">
    <label for="search" class="mb-2">{{ labelText }}</label>
    <div class="input-group">
        <span class="input-group-text" role="status">
            @if (loading$ | async) {
                <div class="spinner-border spinner-border-sm">
                    <span class="visually-hidden">{{ searchText }}</span>
                </div>
            } @else {
                <lc-icon [icon]="actionIcons.search" />
            }
        </span>
        <input id="search" type="search" class="form-control" [formControl]="searchControl" />
    </div>
</form>
