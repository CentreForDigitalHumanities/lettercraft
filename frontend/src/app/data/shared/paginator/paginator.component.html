@if (pageResult.totalSize$ | async; as totalSize) {
    <div class="hstack">
        <div class="mx-auto" [ngbCollapse]="totalSize <= pageResult.pageSize">
            <ngb-pagination aria-label="page" [(page)]="pageResult.page"
                [pageSize]="pageResult.pageSize" [collectionSize]="totalSize"
                [ellipses]="true" [maxSize]="3" [rotate]="true" />
        </div>
    </div>
}
